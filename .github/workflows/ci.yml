name: Build and test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore packages
        run: dotnet restore Part2/RaceDay.sln

      - name: Build
        run: dotnet build Part2/RaceDay.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test Part2/RaceDay.sln --no-build --configuration Release
